name: v0.9.27 fixed-award acceptance and matched service
on:
  push:
    branches: [research/v0927-contract-acceptance]
  pull_request:
    paths:
      - 'src/biogasflex/contract_v0927.py'
      - 'scripts/audit_v0927_contract_independent.py'
      - 'tests/test_v0927_contract.py'
      - 'docs/V0927_CONTRACT_ACCEPTANCE_PROTOCOL.md'
      - '.github/workflows/v0927-contract-acceptance.yml'
      - 'SHA256SUMS.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biogasflex-v0927-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Fixed-contract gates / ${{ matrix.os }} / Py ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest tests.test_v0926_physical_si tests.test_v0927_contract -v
      - run: python scripts/verify_v09_manifest.py
      - run: python scripts/verify_v091_git_coverage.py
  complete-source:
    name: All 92 frozen source dates and independent contract gate ledger
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Verify original publisher source
        run: python -m biogasflex source-evidence-v0921 --csv "$RUNNER_TEMP/opsd.csv" --download --output "$RUNNER_TEMP/source.json"
      - name: Run predeclared acceptance and score all 92 days
        run: python -m biogasflex.contract_v0927 --source "$RUNNER_TEMP/source.json" --output "$RUNNER_TEMP/v0927_full.json"
      - name: Independently evaluate every gate and matched service
        run: python scripts/audit_v0927_contract_independent.py --source "$RUNNER_TEMP/source.json" --study "$RUNNER_TEMP/v0927_full.json" --output "$RUNNER_TEMP/v0927_audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v0927-complete-contract-gate-and-independent-certificate
          path: |
            ${{ runner.temp }}/v0927_full.json
            ${{ runner.temp }}/v0927_audit.json
          retention-days: 30
