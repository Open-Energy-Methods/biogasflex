name: v0.9.19 endogenous CHP frontier, independent LP primal-dual and binary proof

on:
  push:
    paths:
      - '.github/workflows/v0919-endogenous-frontier.yml'
      - 'src/biogasflex/benchmark_v0919.py'
      - 'scripts/audit_v0919_independent.py'
      - 'tests/test_v0919_endogenous_duality.py'
  pull_request:
    paths:
      - '.github/workflows/v0919-endogenous-frontier.yml'
      - 'src/biogasflex/benchmark_v0919.py'
      - 'scripts/audit_v0919_independent.py'
      - 'tests/test_v0919_endogenous_duality.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original solver package
        run: python -m pip install -e .
      - name: Execute original synthetic CHP solver over all finite design cells
        shell: bash
        run: |
          set -euo pipefail
          python -m biogasflex benchmark-v0919 --output "$RUNNER_TEMP/v0919_finite_synthetic_design.json"
      - name: Independent reconstruction of LP KKT and exhaustive 8-slot MILP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_v0919_independent.py --input "$RUNNER_TEMP/v0919_finite_synthetic_design.json" --output "$RUNNER_TEMP/v0919_independent_kkt_enumeration.json"
      - name: Archive synthetic data and independent certificate reports
        uses: actions/upload-artifact@v4
        with:
          name: biogasflex-v0919-endogenous-MILP-LP-dual-KKT-finite-design
          path: |
            ${{ runner.temp }}/v0919_finite_synthetic_design.json
            ${{ runner.temp }}/v0919_independent_kkt_enumeration.json
          if-no-files-found: error
          retention-days: 60
