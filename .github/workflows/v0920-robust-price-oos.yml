name: v0.9.20 price-robust CHP and out-of-sample independent scientific audit

on:
  push:
    paths:
      - '.github/workflows/v0920-robust-price-oos.yml'
      - 'src/biogasflex/robust_v0920.py'
      - 'scripts/audit_v0920_independent.py'
      - 'tests/test_v0920_robust_oos.py'
      - 'scripts/audit_v0919_independent.py'
      - 'scripts/plot_v0920_robustness.py'
  pull_request:
    paths:
      - '.github/workflows/v0920-robust-price-oos.yml'
      - 'src/biogasflex/robust_v0920.py'
      - 'scripts/audit_v0920_independent.py'
      - 'tests/test_v0920_robust_oos.py'
      - 'scripts/audit_v0919_independent.py'
      - 'scripts/plot_v0920_robustness.py'
  workflow_dispatch:

concurrency:
  group: biogasflex-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robustness-and-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install unchanged CHP scientific solver
        run: python -m pip install -e .
      - name: Independent small-model adversarial scientific tests
        run: python -m unittest tests.test_v0920_robust_oos -q
      - name: Solve frozen ex-ante nominal and rectangular robust policies
        shell: bash
        run: |
          set -euo pipefail
          python -m biogasflex.robust_v0920 --output "$RUNNER_TEMP/v0920_price_robust_heldout_synthetic.json"
      - name: Independently audit physical schedule KKT, price vertices and heldout chronology
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_v0920_independent.py --input "$RUNNER_TEMP/v0920_price_robust_heldout_synthetic.json" --output "$RUNNER_TEMP/v0920_independent_rectangular_certificates.json"
      - name: Reproduce normalized price-robustness and selected heldout SVG figures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/plot_v0920_robustness.py --report "$RUNNER_TEMP/v0920_price_robust_heldout_synthetic.json" --out-dir "$RUNNER_TEMP/v0920_robust_figures"
      - name: Archive audited synthetic research charts
        uses: actions/upload-artifact@v4
        with:
          name: biogasflex-v0920-reference-and-wide-price-robustness-four-svgs
          path: ${{ runner.temp }}/v0920_robust_figures/*.svg
          if-no-files-found: error
          retention-days: 60
      - name: Archive synthetic scenario inputs and independently certified out-of-sample results
        uses: actions/upload-artifact@v4
        with:
          name: biogasflex-v0920-rectangular-robust-and-heldout-independent-witness
          path: |
            ${{ runner.temp }}/v0920_price_robust_heldout_synthetic.json
            ${{ runner.temp }}/v0920_independent_rectangular_certificates.json
          if-no-files-found: error
          retention-days: 60
