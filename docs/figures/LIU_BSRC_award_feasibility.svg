<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Physical completion of hypothetical fixed electricity export by gas storage size</title>
  <desc id="chart-desc">Out of 92 historical evaluation dates with synthetic biogas and heat paths, at 0.090 megawatt-hours per fifteen minutes 61 days were feasible with 1.5 megawatt-hours gas storage and 92 with 3.0; at 0.100, 88 and 91; at 0.150, zero for both due to an initial generator ramp constraint. These are retrospective model results, not reliability probabilities.</desc>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="30" y="38" fill="#102945" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="21">Full six-hour physical service: gas storage sensitivity</text>
  <text x="30" y="65" fill="#566575" font-family="Arial, Helvetica, sans-serif" font-size="14">Historical SE3 dates, assumed gas/heat paths • 92 cases per award and capacity</text>
  <rect x="32" y="83" width="18" height="13" rx="2" fill="#2761a5"/>
  <text x="58" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#27394a">1.5 MWh gas buffer</text>
  <rect x="264" y="83" width="18" height="13" rx="2" fill="#128778"/>
  <text x="291" y="94" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#27394a">3.0 MWh gas buffer</text>
  <text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="12" fill="#566575">Fixed award</text>
  <text x="30" y="145" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#566575">(MWh electric / 15 min)</text>
  <text x="452" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#425366">Feasible days (out of 92)</text>
  <g stroke="#d9e1e7" stroke-width="1" stroke-dasharray="3,5">
    <line x1="230" y1="149" x2="230" y2="369"/>
    <line x1="345" y1="149" x2="345" y2="369"/>
    <line x1="460" y1="149" x2="460" y2="369"/>
    <line x1="575" y1="149" x2="575" y2="369"/>
    <line x1="690" y1="149" x2="690" y2="369"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#425366" text-anchor="middle">
    <text x="230" y="143">0</text><text x="345" y="143">23</text><text x="460" y="143">46</text><text x="575" y="143">69</text><text x="690" y="143">92</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#102945">
    <text x="30" y="194">0.090</text>
    <text x="30" y="271">0.100</text>
    <text x="30" y="348">0.150</text>
  </g>
  <g fill="#2761a5">
    <rect x="230" y="167" width="305" height="18" rx="2"/>
    <rect x="230" y="244" width="440" height="18" rx="2"/>
    <circle cx="231" cy="330" r="3.5"/>
  </g>
  <g fill="#128778">
    <rect x="230" y="189" width="460" height="18" rx="2"/>
    <rect x="230" y="266" width="455" height="18" rx="2"/>
    <circle cx="231" cy="352" r="3.5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#102945">
    <text x="543" y="181">61/92</text>
    <text x="702" y="203">92/92</text>
    <text x="680" y="258">88/92</text>
    <text x="697" y="280">91/92</text>
    <text x="245" y="334">0/92</text>
    <text x="245" y="356">0/92</text>
  </g>
  <line x1="230" y1="374" x2="690" y2="374" stroke="#7c8c9a"/>
  <rect x="20" y="388" width="820" height="36" rx="4" fill="#f2f5f8"/>
  <text x="29" y="403" fill="#334658" font-family="Arial, Helvetica, sans-serif" font-size="12">0.150 MWh/15 min fails the model's first-interval ramp at both capacities.</text>
  <text x="29" y="417" fill="#566575" font-family="Arial, Helvetica, sans-serif" font-size="11">Not actual plant measurements, awarded exports or a calibrated reliability estimate.</text>
</svg>
